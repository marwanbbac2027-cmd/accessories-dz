<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ACCESSORIES DZ | الإدارة</title>
  <link rel="icon" href="/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="admin-wrap">
  <div id="loginView" class="login-box card-form">
    <h1 class="section-title">لوحة الإدارة</h1>
    <p class="muted">أدخل رمز الإدارة للمتابعة. لا يُحفظ الرمز في المتصفح.</p>
    <label><span>رمز الإدارة</span>
      <input id="tokenInput" type="password" autocomplete="off" dir="ltr">
    </label>
    <button class="btn btn-primary" id="loginBtn" type="button">دخول</button>
    <p class="form-msg" id="loginMsg" role="status"></p>
  </div>

  <div id="panel" hidden>
    <div class="admin-bar">
      <h1 class="section-title">لوحة الإدارة</h1>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabListings" aria-selected="true">المنتجات</button>
        <button type="button" role="tab" id="tabMessages" aria-selected="false">رسائل الزبائن</button>
      </div>
    </div>
    <section id="listingsView">
      <div class="admin-bar">
        <label><span class="sr-only">الحالة</span>
          <select id="statusFilter">
            <option value="pending">قيد المراجعة</option>
            <option value="approved">منشورة</option>
            <option value="rejected">مرفوضة</option>
          </select>
        </label>
        <button class="btn btn-ghost" type="button" id="refreshBtn">تحديث</button>
      </div>
      <div id="listings"></div>
    </section>
    <section id="messagesView" hidden>
      <div id="messages"></div>
    </section>
    <p class="form-msg" id="adminMsg" role="status"></p>
  </div>
</main>
<script src="/admin.js"></script>
</body>
</html>
