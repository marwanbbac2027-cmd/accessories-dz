<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ACCESSORIES DZ | الإدارة</title>
  <link rel="icon" href="/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="admin-wrap">
  <div id="loginView" class="login-box card-form">
    <h1 class="section-title">لوحة الإدارة</h1>
    <p class="muted">أدخل رمز الإدارة للمتابعة. لا يُحفظ الرمز في المتصفح.</p>
    <label><span>رمز الإدارة</span>
      <input id="tokenInput" type="password" autocomplete="off" dir="ltr">
    </label>
    <button class="btn btn-primary" id="loginBtn" type="button">دخول</button>
    <p class="form-msg" id="loginMsg" role="status"></p>
  </div>

  <div id="panel" hidden>
    <div class="admin-bar">
      <h1 class="section-title">لوحة الإدارة</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="أقسام الإدارة">
      <button type="button" role="tab" data-tab="orders" aria-selected="true">الطلبات</button>
      <button type="button" role="tab" data-tab="review" aria-selected="false">مراجعة المنتجات</button>
      <button type="button" role="tab" data-tab="products" aria-selected="false">المنتجات</button>
      <button type="button" role="tab" data-tab="messages" aria-selected="false">الرسائل</button>
      <button type="button" role="tab" data-tab="coupons" aria-selected="false">الكوبونات</button>
      <button type="button" role="tab" data-tab="stats" aria-selected="false">الإحصاءات</button>
      <button type="button" role="tab" data-tab="backup" aria-selected="false">النسخ الاحتياطي</button>
    </nav>

    <section data-section="orders">
      <div class="admin-bar">
        <label><span class="sr-only">الحالة</span>
          <select id="orderStatus"></select>
        </label>
        <label><span class="sr-only">بحث</span>
          <input id="orderQ" type="search" placeholder="رقم الطلب أو الاسم أو الهاتف">
        </label>
        <button class="btn btn-ghost" type="button" id="orderSearch">بحث</button>
      </div>
      <div id="orderList"></div>
      <div id="orderDetail" class="acard" hidden></div>
    </section>

    <section data-section="review" hidden>
      <div class="admin-bar">
        <label><span class="sr-only">الحالة</span>
          <select id="reviewStatus">
            <option value="pending">قيد المراجعة</option>
            <option value="rejected">مرفوضة</option>
          </select>
        </label>
        <button class="btn btn-ghost" type="button" id="reviewRefresh">تحديث</button>
      </div>
      <div id="reviewList"></div>
    </section>

    <section data-section="products" hidden>
      <div id="productList"></div>
    </section>

    <section data-section="messages" hidden>
      <div id="messageList"></div>
    </section>

    <section data-section="coupons" hidden>
      <form id="couponForm" class="card-form" novalidate>
        <h2 class="section-title">كوبون جديد</h2>
        <label><span>الكود (أحرف وأرقام إنجليزية، 3 على الأقل)</span>
          <input name="code" maxlength="20" dir="ltr" required>
        </label>
        <label><span>نوع الخصم</span>
          <select name="kind">
            <option value="percent">نسبة مئوية %</option>
            <option value="amount">مبلغ ثابت (دج)</option>
          </select>
        </label>
        <label><span>القيمة</span>
          <input name="value" type="number" min="1" step="1" required dir="ltr">
        </label>
        <label><span>عدد مرات الاستعمال الأقصى (اتركه فارغًا لغير محدود)</span>
          <input name="max_uses" type="number" min="1" step="1" dir="ltr">
        </label>
        <button class="btn btn-primary" type="submit">إنشاء الكوبون</button>
      </form>
      <div id="couponList"></div>
    </section>

    <section data-section="stats" hidden>
      <div id="statsBox"></div>
    </section>

    <section data-section="backup" hidden>
      <div class="acard">
        <h2 class="section-title">نسخة احتياطية لقاعدة البيانات</h2>
        <p class="muted">تحتوي النسخة على كل الطلبات والمنتجات والرسائل. احفظها في مكان آمن ولا تشاركها مع أحد.</p>
        <button class="btn btn-primary" type="button" id="backupBtn">تنزيل النسخة الاحتياطية</button>
      </div>
    </section>

    <p class="form-msg" id="adminMsg" role="status"></p>
  </div>
</main>
<script src="/admin.js"></script>
</body>
</html>
