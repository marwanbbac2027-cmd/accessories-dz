<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ACCESSORIES DZ | إدارة منتجك</title>
  <link rel="icon" href="/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="admin-wrap">
  <h1 class="section-title">إدارة منتجك</h1>
  <p class="muted">عدّل السعر والكمية والوصف. الصفحة تعمل بالرابط الخاص الذي حصلت عليه عند إضافة المنتج.</p>

  <div id="noToken" class="acard" hidden>
    <p>الرابط غير مكتمل. افتح الرابط الكامل الذي حفظته عند إضافة المنتج.</p>
  </div>

  <div id="notFound" class="acard" hidden>
    <p>لم نجد منتجًا بهذا الرابط. ربما الرابط غير صحيح أو تم استبداله.</p>
  </div>

  <form id="manageForm" class="card-form" novalidate hidden>
    <img id="preview" alt="" style="width:100%;max-width:240px;border-radius:12px;aspect-ratio:4/5;object-fit:cover;background:#eee">
    <p><strong id="mTitle"></strong></p>
    <p class="small muted" id="mStatus"></p>
    <label><span>السعر (دج)</span><input name="price" type="number" min="100" step="1" required dir="ltr"></label>
    <label><span>سعر الخصم (اختياري)</span><input name="discount_price" type="number" min="1" step="1" dir="ltr"></label>
    <label><span>الكمية المتوفرة</span><input name="stock" type="number" min="0" step="1" required dir="ltr"></label>
    <label><span>الوصف</span><textarea name="description" maxlength="1000" rows="4"></textarea></label>
    <button class="btn btn-primary" type="submit">حفظ التعديلات</button>
    <p class="form-msg" id="mMsg" role="status"></p>
  </form>
</main>
<script src="/manage.js"></script>
</body>
</html>
